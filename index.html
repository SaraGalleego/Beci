<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Bienvenida - Beci</title>
<!-- Fonts: DM Sans and Poppins -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,800&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
    /* CSS Vanilla implementation replacing Tailwind */
    :root {
        --beci-blue: #062573;
        --beci-purple: #A855F7;
        --beci-text-purple: #A855F7;
        --font-display: 'DM Sans', sans-serif;
        --font-body: 'Poppins', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        font-family: var(--font-body);
        color: #000;
        height: 100vh;
        overflow: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
        background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6wH234s27gx8X8rkJr8JCEZDhnGCor_aZVlbTQB2jVD5SY77X_Oz_kyGfK4Q5YA09GeEGBdSFT2t7M4WheXOJguZaVGBVDiVGPYTlxJaq7djZNidITXbjFGQ3nGffyht1_bZUPxNkOzdfhDLmNzGn_fUV7CMdsQf23Bm-MjX8dlMwHP654_6bWBBatkohkwUw--qGCrEfl2hZ3_mMlMIzwLXoM-rdvBSsELSaH69HrFGSHCQ0BMVmZvwCucTrsa8lYA');
        background-size: cover;
        background-position: center bottom;
        background-repeat: no-repeat;
    }

    /* Layout */
    .main-container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        padding: 4vh 2rem 3vh 2rem;
    }

    .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .left-col {
        display: flex;
        flex-direction: column;
        z-index: 10;
    }

    header {
        width: 100%;
        margin-bottom: 2vh;
        opacity: 0;
    }

    .logo {
        width: 140px;
        object-fit: contain;
        transform: rotate(-5deg);
        margin-left: 0;
    }

    /* Text Content */
    .text-content {
        display: flex;
        flex-direction: column;
        gap: 0.5vh;
        opacity: 0;
        margin-top: 2vh;
    }

    .badge {
        display: inline-block;
        background-color: var(--beci-purple);
        color: white;
        padding: 0.2rem 0.8rem;
        border-radius: 9999px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 0.875rem;
        width: max-content;
        margin-bottom: 0.5rem;
    }

    h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 2rem;
        line-height: 1.1;
        color: #000;
    }

    .text-purple { color: var(--beci-text-purple); }

    p {
        font-family: var(--font-body);
        font-size: 0.95rem;
        color: #000;
        font-weight: 500;
        margin-top: 0.5rem;
        max-width: 280px;
        line-height: 1.3;
    }

    /* Character */
    .character-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        flex: 1;
        opacity: 0;
        pointer-events: none;
        position: relative;
        z-index: 1;
        margin-bottom: -5vh; /* Drop below button level slightly if needed, or adjust to sit on button */
    }

    .character-img {
        height: 55vh;
        width: auto;
        object-fit: contain;
        transform-origin: bottom center;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        margin-bottom: 0;
    }

    /* CTA Button */
    .cta-container {
        display: flex;
        justify-content: center;
        width: 100%;
        opacity: 0;
        z-index: 20;
        position: relative;
    }

    .btn-primary {
        background-color: var(--beci-blue);
        color: white;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1.25rem;
        letter-spacing: 0.025em;
        padding: 1rem 3rem;
        border: none;
        border-radius: 9999px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        max-width: 320px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-primary:hover {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
    }

    .light-sweep {
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        transform: skewX(-25deg);
        transition: none;
    }

    .btn-primary:hover .light-sweep {
        animation: sweep 0.7s ease-in-out;
    }

    /* Particles/Clouds - Simulated for animation request */
    .particle {
        position: absolute;
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
    }
    
    .particle-triangle {
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 14px solid #F87171;
        position: absolute;
        z-index: 1;
    }

    /* Animations */
    @keyframes sweep {
        0% { left: -150%; }
        100% { left: 150%; }
    }

    @keyframes slideLeftIn {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideUpIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes slideInCharacter {
        from { opacity: 0; transform: translateY(50px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes characterLife {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-5px) rotate(1deg); }
        50% { transform: translateY(-8px) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(-1deg); }
    }

    @keyframes floatDeco {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    /* Animation Classes to be applied by JS */
    .animate-slide-left {
        animation: slideLeftIn 0.8s ease-out forwards;
    }
    
    .animate-slide-up {
        animation: slideUpIn 0.8s ease-out forwards;
    }

    .animate-character-in {
        animation: slideInCharacter 1s ease-out forwards, characterLife 6s ease-in-out infinite 1s;
    }

    .anim-float { animation: floatDeco 6s infinite ease-in-out; }

    /* Desktop Media Query */
    @media (min-width: 1024px) {
        .main-container {
            padding: 8vh 4rem;
        }

        .content-area {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .left-col {
            flex: 1;
            max-width: 50%;
            justify-content: center;
        }

        .logo {
            width: 250px;
            margin-bottom: 2rem;
        }

        .badge {
            font-size: 1.25rem;
            padding: 0.4rem 1.2rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
        }

        p {
            font-size: 1.5rem;
            max-width: 500px;
            margin-top: 1.5rem;
        }

        .character-container {
            flex: 1;
            justify-content: flex-end;
            margin-bottom: -15vh;
        }

        .character-img {
            height: 85vh;
        }

        .cta-container {
            position: absolute;
            bottom: 8vh;
            left: 4rem;
            width: auto;
            justify-content: flex-start;
        }

        .btn-primary {
            font-size: 1.5rem;
            padding: 1.25rem 4rem;
            max-width: 400px;
        }
    }

</style>
<style>@media (min-width: 1024px) { .character-img { height: 70vh !important; } }</style></head>
<body>
<!-- Particles (Simulated from reference) -->

<div class="particle anim-float" style="width: 14px; height: 14px; top: 75%; left: 15%; background-color: #A78BFA; animation-delay: 2s;"></div>
<div class="particle-triangle anim-float" style="top: 80%; left: 25%; transform: rotate(15deg); animation-delay: 1s;"></div>
<div class="particle anim-float" style="width: 8px; height: 8px; bottom: 15%; left: 40%; background-color: #FCD34D; animation-delay: 1.5s;"></div>
<!-- Main Layout -->
<main class="main-container">
<div class="content-area">
<div class="left-col">
<!-- Header -->
<header class="animate-slide-left" id="header-anim">
<img alt="Beci Logo" class="logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFZDfrFrZMot1pPMPF3aNtNuUKLQczIr69KuMAcMrpI9mWiSEO2asSTW6CA1pah59JtsYjQNEf_voXknJXi841IFArnlFhtk002-j3AJfTmxC9DxO7ld7f5tYhamjRRR-qcSIuia5DzuUx0WdmeWwfCFEuZW_DNKzU0YKMQ_lXz51nwJo6RGlJwyh-jeiNOjriGZFR6u10gOZILWpMXbZl4WbHazFBZXzqX0AEontJrll0l1igDYyLOtlqPVdSQ3Szqw">
</header>
<!-- Text Content -->
<section class="text-content animate-slide-left" id="text-anim">
<div class="badge">
                    ¡Hola Vecino!
                </div>
<h1 class="">
                    ¡Bienvenido a <br>
<span class="text-purple">Beci</span>!
                </h1>
<p class="">
                    Explora, conoce y conéctate con los espacios que hacen vibrar tu comunidad
                </p>
</section>
</div>
<!-- Character -->
<div class="character-container animate-character-in" id="char-anim">
<img alt="Beci Character Waving" class="character-img" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzeImZYzdhl-90q_tr1KYraN2Xv8s_e30XOBpsHKEo2UWVSbDOppZ0YvEIVVAZ9NPLbgprfHmZdp7HMA8gcbsNAXM6nIFDS9zvN1sKxavgZI9tVdDsLjDWjElFIU-W8nTxDYdBFaiXavoY4wIQUx5VIae_p-FY3sXXXXKWvozahLNsLYziat_5jesfniC-wwim2wFNzc75YGQ0tXeSuSAM_KWvE3o_a1hkJr1K7q4ylcwuZBgkw6Hq1Ae7CFLQ5WTOxA">
</div>
</div>
<!-- CTA Button -->
<div class="cta-container animate-slide-up" id="cta-anim" style="position: relative; bottom: auto; left: auto; width: 100%; justify-content: center; margin-top: -2vh;">
<button class="btn-primary" type="button" onclick="window.location.href='HomeBeci.html'" style="max-width: 320px; width: 100%; padding: 1rem 3rem; font-family: &quot;DM Sans&quot;, sans-serif; font-weight: 800;">
            Comenzar
            <div class="light-sweep"></div>
</button>
</div>
</main>
<script>
    // Pure JS Animations Initialization
    document.addEventListener("DOMContentLoaded", () => {
        
        // Entry Animations
        const header = document.getElementById('header-anim');
        const textContent = document.getElementById('text-anim');
        const ctaBtn = document.getElementById('cta-anim');
        const character = document.getElementById('char-anim');

        // Delay cascade for entry
        if(header) setTimeout(() => header.classList.add('animate-slide-left'), 100);
        if(textContent) setTimeout(() => textContent.classList.add('animate-slide-left'), 300);
        if(ctaBtn) setTimeout(() => ctaBtn.classList.add('animate-slide-up'), 600);
        if(character) setTimeout(() => character.classList.add('animate-character-in'), 800);

    });
</script>








</body></html>
