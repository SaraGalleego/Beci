<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Bienvenida - Beci</title>
<!-- Fonts: DM Sans and Poppins -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,800&amp;family=Poppins:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
    /* CSS Vanilla implementation replacing Tailwind */
    :root {
        --beci-blue: #062573;
        --beci-purple: #A855F7;
        --beci-text-purple: #A855F7;
        --font-display: 'DM Sans', sans-serif;
        --font-body: 'Poppins', sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        font-family: var(--font-body);
        color: #000;
        height: 100vh;
        overflow: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
        background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD6wH234s27gx8X8rkJr8JCEZDhnGCor_aZVlbTQB2jVD5SY77X_Oz_kyGfK4Q5YA09GeEGBdSFT2t7M4WheXOJguZaVGBVDiVGPYTlxJaq7djZNidITXbjFGQ3nGffyht1_bZUPxNkOzdfhDLmNzGn_fUV7CMdsQf23Bm-MjX8dlMwHP654_6bWBBatkohkwUw--qGCrEfl2hZ3_mMlMIzwLXoM-rdvBSsELSaH69HrFGSHCQ0BMVmZvwCucTrsa8lYA');
        background-size: cover;
        background-position: center bottom;
        background-repeat: no-repeat;
    }

    /* Layout */
    .main-container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        padding: 4vh 2rem 3vh 2rem;
    }

    .content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .left-col {
        display: flex;
        flex-direction: column;
        z-index: 10;
    }

    header {
        width: 100%;
        margin-bottom: 2vh;
        opacity: 0;
    }

    .logo {
        width: 140px;
        object-fit: contain;
        transform: rotate(-5deg);
        margin-left: 0;
    }

    /* Text Content */
    .text-content {
        display: flex;
        flex-direction: column;
        gap: 0.5vh;
        opacity: 0;
        margin-top: 2vh;
    }

    .badge {
        display: inline-block;
        background-color: var(--beci-purple);
        color: white;
        padding: 0.2rem 0.8rem;
        border-radius: 9999px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 0.875rem;
        width: max-content;
        margin-bottom: 0.5rem;
    }

    h1 {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 2rem;
        line-height: 1.1;
        color: #000;
    }

    .text-purple { color: var(--beci-text-purple); }

    p {
        font-family: var(--font-body);
        font-size: 0.95rem;
        color: #000;
        font-weight: 500;
        margin-top: 0.5rem;
        max-width: 280px;
        line-height: 1.3;
    }

    /* Character */
    .character-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        flex: 1;
        opacity: 1;
        pointer-events: none;
        position: relative;
        z-index: 1;
        margin-bottom: -5vh; /* Drop below button level slightly if needed, or adjust to sit on button */
    }

    .character-img {
        height: 40vh;
        max-height: 320px;
        width: auto;
        object-fit: contain;
        transform-origin: bottom center;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        margin-bottom: 0;
    }

    /* CTA Button */
    .cta-container {
        display: flex;
        justify-content: center;
        width: 100%;
        opacity: 0;
        z-index: 20;
        position: relative;
    }

    .btn-primary {
        background-color: var(--beci-blue);
        color: white;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1.25rem;
        letter-spacing: 0.025em;
        padding: 1rem 3rem;
        border: none;
        border-radius: 9999px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        max-width: 320px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-primary:hover {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        transform: translateY(-2px);
    }

    .light-sweep {
        position: absolute;
        top: 0;
        left: -150%;
        width: 100%;
        height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        transform: skewX(-25deg);
        transition: none;
    }

    .btn-primary:hover .light-sweep {
        animation: sweep 0.7s ease-in-out;
    }

    /* Particles/Clouds - Simulated for animation request */
    .particle {
        position: absolute;
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
    }
    
    .particle-triangle {
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 14px solid #F87171;
        position: absolute;
        z-index: 1;
    }

    /* Animations */
    @keyframes sweep {
        0% { left: -150%; }
        100% { left: 150%; }
    }

    @keyframes slideLeftIn {
        from { opacity: 0; transform: translateX(-30px); }
        to { opacity: 1; transform: translateX(0); }
    }

    @keyframes slideUpIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes characterEntrance {
        0% {
            opacity: 0;
            transform: translateX(120%);
        }
        100% {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes characterEntranceDesktop {
        0% {
            opacity: 1;
            transform: translateX(42%) rotate(0deg) scale(1.02);
        }
        100% {
            opacity: 1;
            transform: translateX(42%) rotate(-8deg) scale(1.02);
        }
    }

    @keyframes characterWave {
        0% { transform: translateY(0) rotate(0deg); }
        15% { transform: translateY(-3px) rotate(-15deg); }
        30% { transform: translateY(-5px) rotate(12deg); }
        45% { transform: translateY(-3px) rotate(-10deg); }
        60% { transform: translateY(-2px) rotate(6deg); }
        75% { transform: translateY(-1px) rotate(-3deg); }
        100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes characterLife {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-5px) rotate(1deg); }
        50% { transform: translateY(-8px) rotate(0deg); }
        75% { transform: translateY(-5px) rotate(-1deg); }
    }

    @keyframes floatDeco {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    /* Animation Classes to be applied by JS */
    .animate-slide-left {
        animation: slideLeftIn 0.8s ease-out forwards;
    }
    
    .animate-slide-up {
        animation: slideUpIn 0.8s ease-out forwards;
    }

    .animate-character-entrance {
        animation: characterEntrance 1s ease-out forwards;
    }

    .animate-character-entrance-desktop {
        animation: characterEntranceDesktop 1s ease-out forwards;
    }

    /* Entrada con el mismo rebote elástico de index.html:
       sale desde la derecha, sobrepasa un poquito la posición y rebota hasta quedar en su lugar. */
    .animate-character-wave .character-img {
        animation: characterPeekPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0s 1 both,
                   characterWavePeek 2.5s ease-in-out 0.6s 1 both;
        transform-origin: 100% 52%;
    }

    @keyframes characterPeekPop {
        0% {
            opacity: 1;
            transform: translateX(115%) rotate(-8deg) scale(1.02);
        }
        58% {
            opacity: 1;
            transform: translateX(30%) rotate(-8deg) scale(1.05);
        }
        76% {
            opacity: 1;
            transform: translateX(48%) rotate(-8deg) scale(1.00);
        }
        88% {
            opacity: 1;
            transform: translateX(38%) rotate(-8deg) scale(1.035);
        }
        100% {
            opacity: 1;
            transform: translateX(42%) rotate(-8deg) scale(1.02);
        }
    }

    @keyframes characterWavePeek {
        0% { transform: translateX(42%) rotate(-8deg) scale(1.02); }
        15% { transform: translateX(42%) rotate(-13deg) scale(1.02); }
        30% { transform: translateX(42%) rotate(-4deg) scale(1.02); }
        45% { transform: translateX(42%) rotate(-11deg) scale(1.02); }
        60% { transform: translateX(42%) rotate(-6deg) scale(1.02); }
        75% { transform: translateX(42%) rotate(-9deg) scale(1.02); }
        100% { transform: translateX(42%) rotate(-8deg) scale(1.02); }
    }

    @keyframes characterIdlePeek {
        0%, 100% { transform: translateX(42%) rotate(-8deg) scale(1.02); }
        25% { transform: translateX(42%) translateY(-3px) rotate(-7deg) scale(1.02); }
        50% { transform: translateX(42%) translateY(-5px) rotate(-8deg) scale(1.02); }
        75% { transform: translateX(42%) translateY(-3px) rotate(-9deg) scale(1.02); }
    }

    .character-float-after-wave .character-img {
        animation: characterIdlePeek 4s ease-in-out infinite;
        transform-origin: 100% 52%;
    }

    .anim-float { animation: floatDeco 6s infinite ease-in-out; }

    /* Desktop Media Query */
    @media (min-width: 1024px) {
        .main-container {
            padding: 8vh 4rem;
        }

        .content-area {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }

        .left-col {
            flex: 1;
            max-width: 50%;
            justify-content: center;
        }

        .logo {
            width: 250px;
            margin-bottom: 2rem;
        }

        .badge {
            font-size: 1.25rem;
            padding: 0.4rem 1.2rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 4rem;
            line-height: 1.1;
        }

        p {
            font-size: 1.5rem;
            max-width: 500px;
            margin-top: 1.5rem;
        }

        .character-container {
            flex: 1;
            justify-content: flex-end;
            margin-bottom: -15vh;
            overflow: visible;
        }

        .character-img {
            height: 100vh;
            transform-origin: bottom right;
        }

        .cta-container {
            position: absolute;
            bottom: 8vh;
            left: 4rem;
            width: auto;
            justify-content: flex-start;
        }

        .btn-primary {
            font-size: 1.5rem;
            padding: 1.25rem 4rem;
            max-width: 400px;
        }
    }


    /* Misma jerarquía de distribución de index.html: solo posición y tamaños. */
    @media (max-width: 1023px) {
        .content-area { justify-content: space-between; }
        .left-col { flex-shrink: 0; }
        .character-container { margin-top: auto; padding-bottom: 2vh; flex-shrink: 0; overflow: visible; }
        .character-img { height: 40vh; max-height: 320px; transform-origin: bottom right; transform: rotate(5deg) scale(1.02); margin-right: -12%; margin-bottom: -12%; }
        .cta-container {
            position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important;
            width: 100% !important; justify-content: center !important;
            padding: 2vh 1rem max(env(safe-area-inset-bottom), 4vh) !important;
            margin-top: 0 !important; background: transparent !important; z-index: 20;
        }
        .btn-primary { max-width: 320px !important; width: 100% !important; padding: 1rem 3rem !important; font-size: 1.25rem !important; }
    }
    @media (min-width: 1024px) {
        .main-container { padding: 8vh 4rem; }
        .content-area { flex-direction: row; align-items: center; justify-content: space-between; }
        .left-col { flex: 1; max-width: 60%; justify-content: flex-start; align-items: flex-start; padding-top: 1vh; gap: 1.25rem; }
        .logo { width: 250px; margin-bottom: 0.5rem; }
        h1 { font-size: clamp(4.5rem, 9vw, 6rem) !important; line-height: 1.05; }
        .text-content p { font-size: clamp(1.6rem, 2.5vw, 2rem) !important; max-width: 600px; line-height: 1.3; }
        .character-container { flex: 0 0 50%; justify-content: flex-end; align-items: flex-end; height: 100%; min-height: 100vh; margin-bottom: 0; overflow: visible; position: relative; }
        .character-img { height: 100vh; max-height: 100vh; width: auto; transform-origin: 100% 52%; transform: translateX(42%) rotate(-8deg) scale(1.02); margin-right: 0; margin-bottom: -20%; }
        .cta-container { position: static !important; width: 100% !important; margin-top: 0.5rem !important; justify-content: flex-start !important; padding: 0 !important; transform: translateY(-3.5vh); }
        .btn-primary { max-width: 400px !important; padding: 1.25rem 4rem !important; font-size: 1.5rem !important; }
    }

</style>

<script>
    // Pure JS Animations Initialization
    document.addEventListener("DOMContentLoaded", () => {
        
        // Entry Animations
        const header = document.getElementById('header-anim');
        const textContent = document.getElementById('text-anim');
        const ctaBtn = document.getElementById('cta-anim');
        const character = document.getElementById('char-anim');

        // Delay cascade for entry
        if(header) setTimeout(() => header.classList.add('animate-slide-left'), 100);
        if(textContent) setTimeout(() => textContent.classList.add('animate-slide-left'), 300);

        if(character) setTimeout(() => {
          // La mascota entra desde la derecha con rebote elástico y después saluda.
          character.classList.add('animate-character-wave');

          // Al terminar el saludo, queda flotando suavemente.
          setTimeout(() => {
            character.classList.add('character-float-after-wave');
          }, 2980);
        }, 400);

        if(ctaBtn) setTimeout(() => {
          // El botón aparece después de que la mascota ya entró y saludó.
          ctaBtn.classList.add('animate-slide-up');

          // Brillo del botón después de su entrada.
          setTimeout(() => ctaBtn.classList.add('sweep-once'), 1400);
        }, 2000);

    });
</script>
