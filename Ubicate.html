<!-- Toast Notification for Interactions -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 bg-beciNavy/90 text-white px-5 py-2.5 rounded-full text-xs font-medium tracking-wide shadow-lg pointer-events-none transition-all duration-300 z-50 opacity-0" id="toastNotification">Navegando a: Tus Favoritos</div>
</div>
<!-- JavaScript Interactions -->
<script data-purpose="menu-controller">
  document.addEventListener('DOMContentLoaded', () => {
    const menuPanel = document.getElementById('glassMenuPanel');
    const closeBtn = document.getElementById('closeMenuBtn');
    const openBtn = document.getElementById('openMenuBtn');
    const menuLinks = document.querySelectorAll('.menu-item-link, .desktop-nav-link');
    const toast = document.getElementById('toastNotification');
    const infoBtn = document.getElementById('infoBtn');

    function showToast(message) {
      if (!toast) return;
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100', '-translate-y-1');
      setTimeout(() => {
        toast.classList.remove('opacity-100', '-translate-y-1');
        toast.classList.add('opacity-0');
      }, 1800);
    }

    function closeMenu() {
      if (!menuPanel) return;
      menuPanel.classList.remove('menu-open');
      menuPanel.classList.add('menu-closed');
    }

    function openMenu() {
      if (!menuPanel) return;
      menuPanel.classList.remove('menu-closed');
      menuPanel.classList.add('menu-open');
    }

    if (closeBtn) {
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeMenu();
      });
    }

    if (openBtn) {
      openBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openMenu();
      });
    }

    menuLinks.forEach((link) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetName = link.textContent.trim();
        showToast(`Navegando a: ${targetName}`);
        closeMenu();
      });
    });

    if (infoBtn) {
      infoBtn.addEventListener('click', () => {
        showToast('Estados: Verde (Trabaja con Beci) | Ámbar (Pendiente)');
      });
    }

    document.addEventListener('click', (e) => {
      if (menuPanel && openBtn && !menuPanel.contains(e.target) && !openBtn.contains(e.target) && menuPanel.classList.contains('menu-open')) {
        closeMenu();
      }
    });
  });
</script>
