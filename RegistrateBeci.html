<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }
    </script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // Elementos del formulario
        const nombre = document.getElementById('regNombre');
        const apellido = document.getElementById('regApellido');
        const correo = document.getElementById('regCorreo');
        const password = document.getElementById('password');
        const terminos = document.getElementById('regTerminos');

        const boton = document.getElementById('btn-register-main');
        const error = document.getElementById('register-error');
        const loginLink = document.getElementById('login-link');

        // Enlace hacia la página de inicio de sesión
        const paginaActual =
            window.location.pathname.split('/').pop() +
            (window.location.search || '');

        loginLink.href =
            'InicioBeci.html?redirect=' +
            encodeURIComponent(paginaActual);

        // Mostrar mensaje de error
        function mostrarError(mensaje) {
            error.textContent = mensaje;
            error.classList.remove('hidden');
        }

        // Registrar usuario
        async function registrarUsuario() {

            // Ocultar mensaje anterior
            error.classList.add('hidden');

            // Validar nombre y apellido
            if (!nombre.value.trim() || !apellido.value.trim()) {
                mostrarError('Completa tu nombre y apellido.');
                return;
            }

            // Validar contraseña
            if (password.value.length < 6) {
                mostrarError('La contraseña debe tener al menos 6 caracteres.');
                return;
            }

            // Validar términos y condiciones
            if (!terminos.checked) {
                mostrarError('Debes aceptar los términos y condiciones.');
                return;
            }

            // Desactivar botón mientras se realiza el registro
            boton.disabled = true;
            boton.textContent = 'Registrando...';

            try {

                // Esperar a que Supabase esté listo
                await window.BeciAuth.ensureReady();

                // Registrar realmente el usuario en Supabase
                const resultado = await window.BeciAuth.register({
                    nombre: nombre.value.trim(),
                    apellido: apellido.value.trim(),
                    correo: correo.value.trim(),
                    password: password.value
                });

                // Si Supabase devuelve un error
                if (!resultado.ok) {
                    mostrarError(resultado.error || 'No se pudo completar el registro.');
                    return;
                }

                // Registro exitoso
                window.location.href =
                    'InicioBeci.html?redirect=' +
                    encodeURIComponent('HomeBeci.html');

            } catch (e) {

                console.error('Error al registrar:', e);
                mostrarError('No se pudo completar el registro.');

            } finally {

                // Volver a activar el botón
                boton.disabled = false;
                boton.textContent = 'Registrarme';
            }
        }

        // Registrar al hacer clic en el botón
        boton.addEventListener('click', registrarUsuario);

    });
</script>
