<!-- Beci Map Component Styles -->
<style data-purpose="beci-map-component">
    #beci-map-wrap {
      position: relative;
      width: 100%;
      height: calc(100dvh - 11.5rem);
      min-height: 460px;
      overflow: hidden;
      border-radius: 24px;
      background: #e7efe5;
      box-shadow: 0 12px 30px rgba(27, 43, 27, 0.14);
      font-family: 'Poppins', system-ui, sans-serif;
    }
    @media (max-width: 480px) {
      #beci-map-wrap {
        min-height: 320px;
        height: calc(100dvh - 10.5rem);
        border-radius: 16px;
      }
    }
    @media (max-width: 375px) {
      #beci-map-wrap {
        min-height: 280px;
        height: calc(100dvh - 10rem);
        border-radius: 12px;
      }
    }
    #beci-map-wrap .leaflet-container {
      width: 100%;
      height: 100%;
      background: #e7efe5;
      font-family: 'Poppins', system-ui, sans-serif;
    }
    #beci-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* Zoom controls propios de Leaflet en la esquina inferior derecha */
    #beci-map-wrap .leaflet-control-zoom {
      position: absolute;
      bottom: 14px;
      right: 12px;
      top: auto;
      left: auto;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    @media (max-width: 480px) {
      #beci-map-wrap .leaflet-control-zoom {
        bottom: 80px; /* Evitar solape con footer fijo */
        right: 8px;
      }
      #beci-map-wrap .leaflet-control-zoom a {
        width: 32px;
        height: 32px;
        line-height: 32px;
        font-size: 16px;
      }
    }
    #beci-map-wrap .leaflet-control-zoom a {
      width: 36px;
      height: 36px;
      line-height: 36px;
      color: #1b2b1b;
      background: rgba(255, 255, 255, 0.94);
      font-size: 18px;
    }
    #beci-map-wrap .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.7);
      font-size: 9px;
    }

    /* --- Controles flotantes --- */
    #beci-map-wrap .beci-map-controls {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #beci-map-wrap .beci-map-controls button {
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
      color: #336926;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    @media (max-width: 480px) {
      #beci-map-wrap .beci-map-controls {
        right: 8px;
        top: 8px;
        gap: 8px;
      }
      #beci-map-wrap .beci-map-controls button {
        width: 40px;
        height: 40px;
      }
      #beci-map-wrap .beci-map-controls button svg {
        width: 20px;
        height: 20px;
      }
    }
    #beci-map-wrap .beci-map-controls button:hover {
      background: #fff;
      transform: scale(1.06);
    }
    #beci-map-wrap .beci-map-controls button:active {
      transform: scale(0.94);
    }
    #beci-map-wrap .beci-map-controls button.locating {
      color: #ff6c01;
      animation: beciLocatePulse 1.1s ease-in-out infinite;
    }
    @keyframes beciLocatePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 108, 1, 0.34); }
      50% { box-shadow: 0 0 0 12px rgba(255, 108, 1, 0); }
    }
    #beci-map-wrap .beci-map-controls button svg {
      width: 22px;
      height: 22px;
    }

    /* --- Pill de estado --- */
    #beci-map-wrap .beci-map-status {
      position: absolute;
      z-index: 1100;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(88%, 380px);
      background: rgba(27, 43, 27, 0.92);
      color: #fff;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    @media (max-width: 480px) {
      #beci-map-wrap .beci-map-status {
        top: 10px;
        max-width: 90%;
        font-size: 11px;
        padding: 7px 12px;
      }
    }
    #beci-map-wrap .beci-map-status.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* --- Capa de cards flotantes --- */
    #beci-map-wrap .beci-search-cards-layer {
      position: absolute;
      inset: 0;
      z-index: 945;
      pointer-events: none;
      overflow: hidden;
    }
    /* Pines de Leaflet por encima de las cards flotantes */
    #beci-map-wrap .leaflet-marker-pane {
      z-index: 960 !important;
    }
    #beci-map-wrap .leaflet-shadow-pane {
      z-index: 955 !important;
    }
    /* --- Cards de sedes --- */
    .ms-card {
      width: clamp(200px, 85vw, 240px);
      max-width: 240px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(22, 31, 26, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 30px rgba(20, 30, 24, 0.4), 0 0 24px rgba(255, 108, 1, 0.25);
      cursor: pointer;
      pointer-events: auto;
      opacity: 0;
      animation: holoIn 0.7s cubic-bezier(0.22, 0.9, 0.3, 1.22) forwards;
      animation-delay: var(--holo-delay);
    }
    @media (min-width: 481px) {
      .ms-card { width: clamp(220px, 40vw, 260px); max-width: 260px; }
    }
    @media (min-width: 768px) {
      .ms-card { width: clamp(230px, 35vw, 280px); max-width: 280px; }
    }
    @media (min-width: 1024px) {
      .ms-card { width: 240px; max-width: 240px; }
    }
    @keyframes holoIn {
      0% { opacity: 0; transform: translateY(18px) scale(0.82); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    .ms-card.func-card {
      box-shadow: 0 14px 30px rgba(20, 30, 24, 0.42), 0 0 0 1.5px rgba(255, 108, 1, 0.4), 0 0 34px rgba(255, 108, 1, 0.35);
    }

    /* Triángulo indicador apuntando al pin */
    .ms-card::after {
      content: '';
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }
    .ms-card.tail-bottom::after {
      bottom: -8px;
      left: var(--sc-tail-x, 50%);
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 8px solid rgba(22, 31, 26, 0.96);
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.25));
    }
    .ms-card.tail-top::after {
      top: -8px;
      left: var(--sc-tail-x, 50%);
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 8px solid rgba(22, 31, 26, 0.96);
      filter: drop-shadow(0 -2px 1px rgba(0, 0, 0, 0.25));
    }
    .ms-card.tail-left::after {
      left: -8px;
      top: var(--sc-tail-y, 50%);
      transform: translateY(-50%);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 8px solid rgba(22, 31, 26, 0.96);
      filter: drop-shadow(-2px 0 1px rgba(0, 0, 0, 0.25));
    }
    .ms-card.tail-right::after {
      right: -8px;
      top: var(--sc-tail-y, 50%);
      transform: translateY(-50%);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 8px solid rgba(22, 31, 26, 0.96);
      filter: drop-shadow(2px 0 1px rgba(0, 0, 0, 0.25));
    }

    /* --- Zona de imagen --- */
    .ms-card-img {
      position: relative;
      height: 132px;
    }
    .ms-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #2c3a2f;
    }
    .ms-card-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.12) 55%, rgba(0, 0, 0, 0.28));
      pointer-events: none;
    }
    .ms-card-img::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 0px, rgba(255, 255, 255, 0.045) 1px, transparent 1px, transparent 5px);
      mix-blend-mode: overlay;
    }
    .ms-card-title {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 30px;
      color: #fff;
      font-weight: 800;
      line-height: 1.15;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .ms-card-addr {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: rgba(255, 255, 255, 0.94);
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }
    .ms-card-addr svg {
      width: 11px;
      height: 11px;
      color: #ff6c01;
      flex-shrink: 0;
    }
    .ms-card-addr span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Botón 360 sobre glass --- */
    .ms-360 {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.32);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .ms-360 svg {
      width: 13px;
      height: 13px;
    }
    .ms-360:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.26);
    }
    .ms-360:active {
      transform: scale(0.95);
    }

    /* --- Botón verde "Ver más" con light sweep --- */
    .ms-vermas {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      border: none;
      padding: 11px 12px;
      background: linear-gradient(135deg, #4db21a, #336926);
      color: #fff;
      font-weight: 800;
      font-size: 12.5px;
      letter-spacing: 0.4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 6px 14px rgba(77, 178, 26, 0.35);
    }
    .ms-vermas svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .ms-vermas:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    .ms-vermas:active {
      transform: translateY(0) scale(0.99);
    }
    .ms-vermas::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      transform: translateX(-160%) skewX(-18deg);
      animation: lightSweep 2.9s 0.9s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes lightSweep {
      0% { transform: translateX(-160%) skewX(-18deg); }
      55%, 100% { transform: translateX(320%) skewX(-18deg); }
    }

    /* --- Toast "Próximamente" --- */
    #beci-map-wrap #ms-toast {
      position: absolute;
      z-index: 1300;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(27, 43, 27, 0.94);
      color: #fff;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      #beci-map-wrap #ms-toast {
        bottom: 80px; /* Evitar solape con footer fijo */
        font-size: 11px;
        padding: 7px 14px;
      }
    }
    #beci-map-wrap #ms-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
  </style>

<body class="bg-[#F4F9F2] text-[#1B2B1B] font-poppins min-h-screen relative overflow-x-hidden flex flex-col justify-between select-none">

<script>
function openHeaderMobileNav() {
    const overlay = document.getElementById('mobile-nav-overlay');
    const modal = document.getElementById('mobile-nav-modal');
    if (!overlay || !modal) return;

    overlay.classList.remove('hidden');
    void overlay.offsetWidth;
    overlay.classList.remove('opacity-0');
    modal.classList.remove('scale-95');
    modal.classList.add('scale-100');
    document.body.style.overflow = 'hidden';
}

function closeHeaderMobileNav() {
    const overlay = document.getElementById('mobile-nav-overlay');
    const modal = document.getElementById('mobile-nav-modal');
    if (!overlay || !modal) return;

    overlay.classList.add('opacity-0');
    modal.classList.remove('scale-100');
    modal.classList.add('scale-95');
    document.body.style.overflow = '';

    setTimeout(() => {
      overlay.classList.add('hidden');
    }, 300);
}

function toggleHeaderMobileNav() {
    const overlay = document.getElementById('mobile-nav-overlay');
    if (overlay && overlay.classList.contains('hidden')) {
      openHeaderMobileNav();
    } else {
      closeHeaderMobileNav();
    }
}

function handleMobileOverlayClick(e) {
    if (e.target.id === 'mobile-nav-overlay') {
      closeHeaderMobileNav();
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeHeaderMobileNav();
    }
});
</script>

<!-- Map Engine -->
<script data-purpose="mapasena-engine">
(function () {
  'use strict';

  /* ============================================================
     Mapasena — 7 sedes SENA en Medellín
     Leaflet + OSM + tarjetas informativas sobre cada pin.
     Solo las cards CTMA y Complejo Norte tienen botones activos.
     ============================================================ */

  var SENA_SEDES_DATA = (typeof window.SENA_SEDES !== 'undefined') ? window.SENA_SEDES : {};

  var CTMA_PHOTO = 'https://lh3.googleusercontent.com/aida-public/AB6AXuDFCsXzGzrYnV9n_kTYKjd7G48mBHWv9VT5xLNYE1dh75id-DLKD1xmVBp41mXZFoSsNNrjPoxkx547QtiMQUDVOEJdz7Fsz8Klr3b6O-AcZ2Sb7lfb--Ab9VM1X4uNESPDyEUyE0M707VpIJ4FpFeVpF0zkGbAzRQFn14OqCfcLOL3TujNIJ8NJkQRaIWXvUsVZJVvkiqGunlNOXteF0m7lrF7g6v7RifDBMUsWsKY9dQCi4oB0nIz';

  var FUNCTIONAL = { 'ctma': true, 'complejo-norte': true };

  var ORDER = [
    'complejo-norte',
    'ctma',
    'servicios-gestion-empresarial',
    'centro-comercio',
    'moda',
    'actividad-fisica',
    'complejo-sur'
  ];

  var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  var TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';

  var PIN_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>';
  var ICON_360 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
  var ICON_ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
  var ICON_BULLSEYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>';

  var el = {
    wrap: document.getElementById('beci-map-wrap'),
    map: document.getElementById('beci-map'),
    layer: document.getElementById('beci-search-cards-layer'),
    status: document.getElementById('beci-map-status'),
    toast: document.getElementById('ms-toast'),
    locateBtn: document.getElementById('beci-locate-btn')
  };

  var map = null;
  var sedes = [];
  var wraps = [];
  var renderedMarkers = [];
  var selectedId = null;
  var statusTimer = null;
  var toastTimer = null;
  var layoutTimer = null;
  var userMarker = null;

  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* -------------------- Utilidades de UI -------------------- */

  function showStatus(message, duration) {
    if (!el.status) return;
    el.status.textContent = message;
    el.status.classList.add('show');
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () {
      el.status.classList.remove('show');
    }, duration || 4500);
  }

  function showToast(message) {
    if (!el.toast) return;
    el.toast.textContent = message;
    el.toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.toast.classList.remove('show');
    }, 1800);
  }

  /* -------------------- Datos -------------------- */

  function buildSedes() {
    ORDER.forEach(function (key) {
      var d = SENA_SEDES_DATA[key];
      if (!d || typeof d.lat !== 'number' || typeof d.lng !== 'number') return;
      sedes.push({
        key: key,
        name: d.nombre,
        sector: d.sector,
        lat: d.lat,
        lng: d.lng,
        img: (FUNCTIONAL[key] ? CTMA_PHOTO : d.img),
        alt: d.alt || d.nombre,
        func: !!FUNCTIONAL[key]
      });
    });
  }

  /* -------------------- Pines -------------------- */

  function pinSvg(fill) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="32" viewBox="0 0 40 46">' +
      '<path d="M20 2 C12.5 2 7 8.2 7 15.6 C7 25 20 44 20 44 C20 44 33 25 33 15.6 C33 8.2 27.5 2 20 2 Z" fill="' + fill + '"/>' +
      '<circle cx="20" cy="16" r="7" fill="#ffffff"/></svg>';
  }

  function pinIcon(selected) {
    return L.divIcon({
      html: pinSvg(selected ? '#336926' : '#4DB21A'),
      className: 'beci-place-icon',
      iconSize: [28, 32],
      iconAnchor: [14, 32]
    });
  }

  function renderMarker(sede) {
    var icon = pinIcon(false);
    var marker = L.marker([sede.lat, sede.lng], { icon: icon, title: sede.name, riseOnHover: true });
    marker.sede = sede;
    marker._defaultIcon = icon;
    marker.on('click', function () {
      focusSede(sede);
      map.flyTo([sede.lat, sede.lng], Math.min(Math.max(map.getZoom(), 13), 15), { duration: 0.9 });
    });
    marker.addTo(map);
    sede.marker = marker;
    renderedMarkers.push(marker);
  }

  function resetAllMarkers() {
    renderedMarkers.forEach(function (marker) {
      if (!marker.sede || !marker.sede.marker) return;
      marker.sede.marker.setIcon(marker.sede.marker._defaultIcon);
      marker.sede.marker.setZIndexOffset(0);
      var w = marker.sede.wrap;
      if (w) w.classList.remove('pulse');
    });
  }

  function focusSede(sede) {
    resetAllMarkers();
    selectedId = sede.key;
    sede.marker.setIcon(pinIcon(true));
    sede.marker.setZIndexOffset(500);
    if (sede.wrap) sede.wrap.classList.add('pulse');
  }

  /* -------------------- Cards holograma -------------------- */

  function action360(sede) {
    if (sede.func) {
      window.location.href = '360ctma.html';
      return;
    }
    showToast('Pr\u00f3ximamente');
  }

  function actionMore(sede) {
    if (sede.func) {
      window.location.href = 'CTMA.html';
      return;
    }
    showToast('Pr\u00f3ximamente');
  }

  function makeCard(sede, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'holo-wrap';
    wrap.setAttribute('data-key', sede.key);
    wrap.style.setProperty('--holo-delay', (320 + idx * 220) + 'ms');
    wrap.sede = sede;
    sede.wrap = wrap;

    var card = document.createElement('div');
    card.className = 'ms-card' + (sede.func ? ' func-card' : '');
    card.title = sede.name;

    var titleEl = '<div class="ms-card-title" style="font-size:' + (sede.name.length > 34 ? '12px' : '13.5px') + '">' + esc(sede.name) + '</div>';
    var addrEl = '<div class="ms-card-addr">' + PIN_ICON + '<span>' + esc(sede.sector) + '</span></div>';
    var chot360 = '<button type="button" class="ms-360" title="Tour virtual 360\u00b0" aria-label="Tour virtual 360\u00b0 de ' + esc(sede.name) + '">' + ICON_360 + '360\u00b0</button>';
    var imgEl = '<div class="ms-card-img"><img class="ms-photo" loading="lazy" alt="' + esc(sede.alt) + '" src="' + esc(sede.img) + '"><div class="ms-card-grad"></div>' + titleEl + addrEl + chot360 + '</div>';
    var btnMore = '<button type="button" class="ms-vermas">Ver m\u00e1s ' + ICON_ARROW + '</button>';

    card.innerHTML = imgEl + btnMore;

    card.querySelector('.ms-360').addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      action360(sede);
    });
    card.querySelector('.ms-vermas').addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      actionMore(sede);
    });

    wrap.appendChild(card);
    el.layer.appendChild(wrap);

    var entry = { wrap: wrap, cardEl: card, sede: sede };
    wraps.push(entry);
    return entry;
  }

  /* -------------------- Layout anti-solape responsive -------------------- */

  function layoutCards() {
    if (!map || !el.layer) return;

    var mapW = el.map.clientWidth;
    var mapH = el.map.clientHeight;
    var isMobile = mapW < 768;
    var margin = isMobile ? 8 : 14;
    var gap = isMobile ? 6 : 10;

    var items = wraps.map(function (w) {
      var p = map.latLngToContainerPoint([w.sede.lat, w.sede.lng]);
      var cw = w.cardEl.offsetWidth || (isMobile ? 156 : 240);
      var ch = w.cardEl.offsetHeight || 170;

      return {
        w: w,
        pinX: p.x,
        pinY: p.y,
        cw: cw,
        ch: ch,
        x: 0,
        y: 0,
        dir: 'tail-bottom'
      };
    });

    var placed = [];

    items.forEach(function (item) {
      var px = item.pinX;
      var py = item.pinY;

      /*
       * Cada card nace visualmente de SU propio pin.
       * Se prueban las cuatro direcciones, priorizando arriba y
       * abajo para conservar el aspecto original del mapa.
       */
      var slots = [
        {
          dir: 'tail-bottom',
          x: px - item.cw / 2,
          y: py - item.ch - 34,
          priority: 0
        },
        {
          dir: 'tail-top',
          x: px - item.cw / 2,
          y: py + 18,
          priority: 1
        },
        {
          dir: 'tail-left',
          x: px + 22,
          y: py - item.ch / 2,
          priority: 2
        },
        {
          dir: 'tail-right',
          x: px - item.cw - 22,
          y: py - item.ch / 2,
          priority: 3
        }
      ];

      var best = null;
      var bestScore = Infinity;

      slots.forEach(function (slot) {
        var x = slot.x;
        var y = slot.y;

        /* Mantener la card dentro del mapa. */
        x = Math.max(margin, Math.min(x, mapW - item.cw - margin));
        y = Math.max(margin, Math.min(y, mapH - item.ch - margin));

        var score = slot.priority * 8;

        /* Penalización por alejarse demasiado del pin. */
        score += Math.abs((x + item.cw / 2) - px) * 0.15;
        score += Math.abs((y + item.ch / 2) - py) * 0.15;

        /* Evitar cards ya colocadas. */
        placed.forEach(function (other) {
          var ox = Math.min(x + item.cw + gap, other.x + other.w + gap) -
                   Math.max(x - gap, other.x - gap);
          var oy = Math.min(y + item.ch + gap, other.y + other.h + gap) -
                   Math.max(y - gap, other.y - gap);

          if (ox > 0 && oy > 0) {
            score += 100000 + ox * oy * 100;
          }
        });

        /* Evitar tapar otros pines. */
        items.forEach(function (other) {
          if (other === item) return;

          var pinLeft = other.pinX - 15;
          var pinRight = other.pinX + 15;
          var pinTop = other.pinY - 30;
          var pinBottom = other.pinY + 4;

          var ox = Math.min(x + item.cw, pinRight) -
                   Math.max(x, pinLeft);
          var oy = Math.min(y + item.ch, pinBottom) -
                   Math.max(y, pinTop);

          if (ox > 0 && oy > 0) {
            score += 5000;
          }
        });

        if (score < bestScore) {
          bestScore = score;
          best = { x: x, y: y, dir: slot.dir };
        }
      });

      item.x = best.x;
      item.y = best.y;
      item.dir = best.dir;

      placed.push({
        x: item.x,
        y: item.y,
        w: item.cw,
        h: item.ch
      });
    });

    /*
     * Separación final: si dos cards se cruzan, se empujan
     * manteniendo su relación con sus respectivos pins.
     */
    for (var pass = 0; pass < 80; pass++) {
      var changed = false;

      for (var i = 0; i < items.length; i++) {
        for (var j = i + 1; j < items.length; j++) {
          var a = items[i];
          var b = items[j];

          var overlapX = Math.min(a.x + a.cw, b.x + b.cw) -
                         Math.max(a.x, b.x);
          var overlapY = Math.min(a.y + a.ch, b.y + b.ch) -
                         Math.max(a.y, b.y);

          if (overlapX > 0 && overlapY > 0) {
            changed = true;

            if (overlapX < overlapY) {
              var pushX = overlapX / 2 + gap;

              if (a.pinX <= b.pinX) {
                a.x -= pushX;
                b.x += pushX;
              } else {
                a.x += pushX;
                b.x -= pushX;
              }
            } else {
              var pushY = overlapY / 2 + gap;

              if (a.pinY <= b.pinY) {
                a.y -= pushY;
                b.y += pushY;
              } else {
                a.y += pushY;
                b.y -= pushY;
              }
            }
          }
        }
      }

      items.forEach(function (item) {
        item.x = Math.max(margin, Math.min(item.x, mapW - item.cw - margin));
        item.y = Math.max(margin, Math.min(item.y, mapH - item.ch - margin));
      });

      if (!changed) break;
    }

    items.forEach(function (item) {
      var w = item.w;

      w.wrap.style.left = item.x + 'px';
      w.wrap.style.top = item.y + 'px';

      var card = w.cardEl;
      card.classList.remove('tail-bottom', 'tail-top', 'tail-left', 'tail-right');
      card.classList.add(item.dir);

      if (item.dir === 'tail-bottom' || item.dir === 'tail-top') {
        var tailX = Math.max(
          16,
          Math.min(item.cw - 16, item.pinX - item.x)
        );
        card.style.setProperty('--sc-tail-x', tailX + 'px');
      } else {
        var tailY = Math.max(
          14,
          Math.min(item.ch - 14, item.pinY - item.y)
        );
        card.style.setProperty('--sc-tail-y', tailY + 'px');
      }
    });
  }

  function scheduleLayout() {
    if (layoutTimer) return;
    layoutTimer = setTimeout(function () {
      layoutTimer = null;
      layoutCards();
    }, 80);
  }

  /* -------------------- Mi ubicación -------------------- */

  function locateUser() {
    if (!navigator.geolocation) {
      showToast('Tu navegador no tiene geolocalizaci\u00f3n');
      return;
    }
    el.locateBtn.classList.add('locating');
    navigator.geolocation.getCurrentPosition(function (pos) {
      el.locateBtn.classList.remove('locating');
      var latlng = [pos.coords.latitude, pos.coords.longitude];
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker(latlng, {
        radius: 9,
        color: '#FF6C01',
        weight: 3,
        fillColor: '#FF6C01',
        fillOpacity: 0.35
      }).addTo(map);
      map.flyTo(latlng, Math.max(map.getZoom(), 13), { duration: 1 });
      showStatus('Est\u00e1s aqu\u00ed', 3000);
    }, function () {
      el.locateBtn.classList.remove('locating');
      showToast('No pudimos obtener tu ubicaci\u00f3n');
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 15000 });
  }

  /* -------------------- Inicialización -------------------- */

  function initMap() {
    if (typeof L === 'undefined' || !el.map) return;

    buildSedes();
    if (!sedes.length) {
      showStatus('No tenemos coordenadas de las sedes del SENA todavía.', 5000);
      return;
    }

    map = L.map('beci-map', { attributionControl: true, zoomControl: false });
    L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    var bounds = L.latLngBounds(sedes.map(function (s) { return [s.lat, s.lng]; }));

    sedes.forEach(function (sede, idx) {
      renderMarker(sede);
      makeCard(sede, idx);
    });

    map.fitBounds(bounds, { padding: [80, 80], maxZoom: 11.3 });

    map.on('move', scheduleLayout);
    map.on('zoom', scheduleLayout);
    map.on('resize', scheduleLayout);
    window.addEventListener('resize', scheduleLayout);

    el.locateBtn.addEventListener('click', locateUser);

    setTimeout(function () {
      layoutCards();
    }, 350);

    setTimeout(function () {
      showStatus(sedes.length + ' sedes del SENA en Medell\u00edn', 4800);
    }, 650);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMap);
  } else {
    initMap();
  }
})();
</script>
