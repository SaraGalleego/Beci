<!-- Script for Password Toggle -->
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
<script>
    (function () {
        'use strict';

        const AUTH = window.BeciAuth;
        const form = document.querySelector('form');
        const err = document.getElementById('login-error');

        function showError(message) {
            if (!err) return;

            err.textContent = message || 'No se pudo iniciar sesión.';
            err.classList.remove('hidden');
        }

        function clearError() {
            if (!err) return;

            err.textContent = '';
            err.classList.add('hidden');
        }

        if (!AUTH || !form) {
            console.error('BECI: no se encontró el sistema de autenticación o el formulario.');
            return;
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            clearError();

            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('password');
            const submitButton = form.querySelector('button[type="submit"]');

            if (!emailInput || !passwordInput) {
                showError('No se encontraron los campos de inicio de sesión.');
                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email) {
                showError('Escribe tu correo.');
                return;
            }

            if (!password) {
                showError('Escribe tu contraseña.');
                return;
            }

            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'Iniciando sesión...';
            }

            try {
                await AUTH.ensureReady();

                const result = await AUTH.login(email, password);

                if (!result || !result.ok) {
                    showError(
                        (result && result.error) ||
                        'Correo o contraseña incorrectos.'
                    );

                    if (submitButton) {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Iniciar Sesión';
                    }

                    return;
                }

                AUTH.redirectAfterAuth('HomeBeci.html');

            } catch (error) {
                console.error('BECI - Error al iniciar sesión:', error);

                showError(
                    'No se pudo iniciar sesión en este momento. Intenta nuevamente.'
                );

                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Iniciar Sesión';
                }
            }
        });
    })();
</script>
