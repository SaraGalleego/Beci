<!-- Script for Password Toggle -->
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function (e) {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
<script>
        (function () {
            const AUTH = window.BeciAuth;
            if (!AUTH) return;
            const form = document.querySelector('form');
            const err = document.getElementById('login-error');

            function showError(msg) {
                if (err) {
                    err.textContent = msg;
                    err.classList.remove('hidden');
                }
            }

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    const email = document.getElementById('loginEmail');
                    const pass = document.getElementById('password');
                    if (!email || !pass) return;
                    if (!email.value.trim()) return showError('Escribe tu correo.');
                    if (!pass.value) return showError('Escribe tu contraseña.');
                    const res = AUTH.login(email.value, pass.value);
                    if (!res.ok) return showError(res.error);
                    AUTH.redirectAfterAuth('HomeBeci.html');
                });
            }
        })();
    </script>
