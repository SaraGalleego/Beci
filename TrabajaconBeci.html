<!-- Interactivity Scripts -->
<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {
      
      // Favorite Button Logic
      const favBtn = document.getElementById('favoriteBtn');
      const outlineIcon = document.getElementById('heartIconOutline');
      const filledIcon = document.getElementById('heartIconFilled');

      favBtn.addEventListener('click', () => {
        const isPressed = favBtn.getAttribute('aria-pressed') === 'true';
        
        if (!isPressed) {
          // Add favorite
          favBtn.setAttribute('aria-pressed', 'true');
          outlineIcon.classList.add('opacity-0');
          filledIcon.classList.remove('opacity-0');
          filledIcon.classList.add('animate-bounce-in');
          setTimeout(() => filledIcon.classList.remove('animate-bounce-in'), 300);
        } else {
          // Remove favorite
          favBtn.setAttribute('aria-pressed', 'false');
          outlineIcon.classList.remove('opacity-0');
          filledIcon.classList.add('opacity-0');
        }
      });

      // Share Button Logic
      const shareBtn = document.getElementById('shareBtn');
      const toast = document.getElementById('toast');
      
      shareBtn.addEventListener('click', async () => {
        const shareData = {
          title: 'Complejo Sena Norte',
          text: 'Un espacio para aprender, crear y crecer',
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            // Fallback: Copy to clipboard
            await navigator.clipboard.writeText(window.location.href);
            showToast();
          }
        } catch (err) {
          // Fallback if rejected or unavailable
          try {
            await navigator.clipboard.writeText(window.location.href);
            showToast();
          } catch (clipErr) {
            console.log('Error sharing/copying:', clipErr);
          }
        }
      });

      function showToast() {
        toast.classList.remove('opacity-0');
        setTimeout(() => {
          toast.classList.add('opacity-0');
        }, 2500);
      }
    });
  </script>
