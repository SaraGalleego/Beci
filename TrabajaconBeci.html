<script data-purpose="interaction-logic">
    document.addEventListener('DOMContentLoaded', () => {

      function getInstitutionId() {
        try {
          var p = new URLSearchParams(window.location.search);
          var key = p.get('sede');
          if (key && window.SENA_SEDES && window.SENA_SEDES[key]) return key;
          var lugar = p.get('lugar');
          if (lugar && window.BeciBadges) {
            var id = window.BeciBadges.resolvePlaceId(lugar);
            if (id) return id;
          }
          if (lugar) return String(lugar).trim();
          if (key) return key;
          return 'complejo-norte';
        } catch (e) { return 'complejo-norte'; }
      }
      // Registrar lugar visitado por el usuario
      function registrarLugarVisitado(id) {
        if (!window.BeciAuth || !BeciAuth.isLoggedIn()) return;

        try {
          var usuario = BeciAuth.currentUser();
          if (!usuario || !usuario.correo) return;

          var clave = 'beci_visitas_' + usuario.correo.toLowerCase().trim();
          var visitas = [];

          try {
            visitas = JSON.parse(localStorage.getItem(clave) || '[]');
          } catch (e) {
            visitas = [];
          }

          if (visitas.indexOf(id) === -1) {
            visitas.push(id);
            localStorage.setItem(clave, JSON.stringify(visitas));
          }
        } catch (e) {
          console.error('BECI - Error al registrar lugar visitado:', e);
        }
      }

      // Registrar la visita únicamente cuando el usuario pulsa uno de los
      // botones de navegación ("Explora este espacio" / "Ver mas sedes"),
      // NO al cargar la página.
      function registrarVisitaAlNavegar() {
        registrarLugarVisitado(getInstitutionId());
      }

      var btnExploraEspacio = document.querySelector('button[onclick*="introsena.html"]');
      var btnVerMasSedes = document.querySelector('button[onclick*="Mapasena.html"]');

      if (btnExploraEspacio) {
        btnExploraEspacio.addEventListener('click', registrarVisitaAlNavegar);
      }

      if (btnVerMasSedes) {
        btnVerMasSedes.addEventListener('click', registrarVisitaAlNavegar);
      }

      function storeFav(id, fav) {
        try { localStorage.setItem('fav_' + id, fav ? 'true' : 'false'); } catch (e) {}
      }

      function isStoredFav(id) {
        try { return localStorage.getItem('fav_' + id) === 'true'; } catch (e) { return false; }
      }

      // Registrar exploración de esta institución (insignias)
      if (window.BeciBadges) {
        var prevKeys = window.BeciBadges.unlockedKeys();
        window.BeciBadges.recordExploracion(getInstitutionId());
        window.BeciBadges.celebrate(prevKeys);
      }

      // Favorite Button Logic (persistente en fav_<id>)
      const favBtn = document.getElementById('favoriteBtn');
      const outlineIcon = document.getElementById('heartIconOutline');
      const filledIcon = document.getElementById('heartIconFilled');

      // Estado inicial desde favoritos guardados
      const initId = getInstitutionId();
      if (isStoredFav(initId)) {
        favBtn.setAttribute('aria-pressed', 'true');
        outlineIcon.classList.add('opacity-0');
        filledIcon.classList.remove('opacity-0');
      }

      favBtn.addEventListener('click', () => {
        if (window.BeciAuth && !BeciAuth.isLoggedIn()) {
          BeciAuth.showLoginGate();
          return;
        }
        const id = getInstitutionId();
        const isPressed = isStoredFav(id);

        if (!isPressed) {
          // Add favorite
          storeFav(id, true);
          favBtn.setAttribute('aria-pressed', 'true');
          outlineIcon.classList.add('opacity-0');
          filledIcon.classList.remove('opacity-0');
          filledIcon.classList.add('animate-bounce-in');
          setTimeout(() => filledIcon.classList.remove('animate-bounce-in'), 300);
          if (window.BeciBadges) {
            const prev = window.BeciBadges.unlockedKeys();
            window.BeciBadges.celebrate(prev);
          }
        } else {
          // Remove favorite
          storeFav(id, false);
          favBtn.setAttribute('aria-pressed', 'false');
          outlineIcon.classList.remove('opacity-0');
          filledIcon.classList.add('opacity-0');
        }
      });

      // Share Button Logic
      const shareBtn = document.getElementById('shareBtn');
      const toast = document.getElementById('toast');
      
      shareBtn.addEventListener('click', async () => {
        const shareData = {
          title: (document.getElementById('sedeTitle') && document.getElementById('sedeTitle').textContent) || 'Complejo Sena Norte',
          text: 'Un espacio para aprender, crear y crecer',
          url: window.location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else {
            // Fallback: Copy to clipboard
            await navigator.clipboard.writeText(window.location.href);
            showToast();
          }
        } catch (err) {
          // Fallback if rejected or unavailable
          try {
            await navigator.clipboard.writeText(window.location.href);
            showToast();
          } catch (clipErr) {
            console.log('Error sharing/copying:', clipErr);
          }
        }
      });

      function showToast() {
        toast.classList.remove('opacity-0');
        setTimeout(() => {
          toast.classList.add('opacity-0');
        }, 2500);
      }
    });
  </script>








<script data-purpose="dynamic-sede">
    (function () {
      var params = new URLSearchParams(window.location.search);
      var config = window.SENA_SEDES || {};
      var sedesDisponibles = Object.keys(config).length > 0;
      var key = params.get("sede");
      var lugar = params.get("lugar");
      var sede = null;

      if (key && config[key]) {
        sede = config[key];
      } else if (lugar) {
        var imgBase = sedesDisponibles && config["complejo-norte"]
          ? config["complejo-norte"].img
          : "";
        sede = {
          nombre: lugar,
          sector: "Medellín",
          descripcion: "Sede del SENA en la ciudad, un espacio para aprender, crear y crecer.",
          pills: ["Aprender", "Crear", "Crecer"],
          img: imgBase,
          alt: "Sede SENA"
        };
      } else if (sedesDisponibles && config["complejo-norte"]) {
        sede = config["complejo-norte"];
      }

      if (!sede) return;

      document.title = sede.nombre + " | SENA | Beci";

      var img = document.getElementById("sedeHeroImg");
      if (img && sede.img) {
        if (img.src !== sede.img) img.src = sede.img;
        if (sede.alt) img.alt = sede.alt;
      }

      var title = document.getElementById("sedeTitle");
      if (title) title.textContent = sede.nombre;

      var sector = document.getElementById("sedeSector");
      if (sector && sede.sector) sector.textContent = sede.sector;

      var desc = document.getElementById("sedeDescription");
      if (desc && sede.descripcion) desc.textContent = sede.descripcion;

      var pills = document.getElementById("sedePills");
      if (pills && sede.pills) {
        pills.innerHTML = "";
        (sede.pills || []).forEach(function (pill) {
          var s = document.createElement("span");
          s.className = "text-text-dark px-4 py-1 md:px-5 md:py-1.5 lg:px-6 lg:py-2 rounded-pill text-sm md:text-base lg:text-lg font-semibold transition-transform hover:scale-105 shadow-xs";
          s.style.backgroundColor = "rgb(253, 152, 196)";
          s.textContent = pill;
          pills.appendChild(s);
        });
      }
    })();
  </script>

</body></html>
