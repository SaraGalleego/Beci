<script data-purpose="menu-toggle-logic">
    // Control del modal de Menú Hamburguesa
    const menuOpenBtn = document.getElementById('menuOpenBtn');
    const menuCloseBtn = document.getElementById('menuCloseBtn');
    const menuModal = document.getElementById('menuModal');
    const menuCard = document.getElementById('menuCard');

    function openModal() {
      menuModal.classList.remove('opacity-0', 'pointer-events-none');
      menuModal.classList.add('opacity-100', 'pointer-events-auto');
      menuCard.classList.remove('scale-90');
      menuCard.classList.add('scale-100');
    }

    function closeModal() {
      menuModal.classList.add('opacity-0', 'pointer-events-none');
      menuModal.classList.remove('opacity-100', 'pointer-events-auto');
      menuCard.classList.add('scale-90');
      menuCard.classList.remove('scale-100');
    }

    menuOpenBtn.addEventListener('click', openModal);
    menuCloseBtn.addEventListener('click', closeModal);

    // Cerrar al hacer clic fuera de la tarjeta
    menuModal.addEventListener('click', (e) => {
      if (e.target === menuModal) {
        closeModal();
      }
    });
  </script>
<script data-purpose="form-controls-logic">
    // Control de visibilidad de contraseña
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIconOpen = document.getElementById('eyeIconOpen');
    const eyeIconClosed = document.getElementById('eyeIconClosed');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      if (isPassword) {
        passwordInput.setAttribute('type', 'text');
        eyeIconOpen.classList.add('hidden');
        eyeIconClosed.classList.remove('hidden');
      } else {
        passwordInput.setAttribute('type', 'password');
        eyeIconOpen.classList.remove('hidden');
        eyeIconClosed.classList.add('hidden');
      }
    });

    // Control del switch de novedades
    const newsletterSwitch = document.getElementById('newsletterSwitch');
    const switchKnob = document.getElementById('switchKnob');
    const switchLabel = document.getElementById('switchLabel');
    let isSubscribed = false;

    function toggleNewsletter() {
      isSubscribed = !isSubscribed;
      newsletterSwitch.setAttribute('aria-checked', isSubscribed.toString());

      if (isSubscribed) {
        newsletterSwitch.classList.remove('bg-slate-200');
        newsletterSwitch.classList.add('bg-[#4DB21A]');
        switchKnob.classList.add('translate-x-5');
      } else {
        newsletterSwitch.classList.add('bg-slate-200');
        newsletterSwitch.classList.remove('bg-[#4DB21A]');
        switchKnob.classList.remove('translate-x-5');
      }
    }

    newsletterSwitch.addEventListener('click', toggleNewsletter);
    switchLabel.addEventListener('click', toggleNewsletter);
  </script>
<!-- END: Interactive Logic Scripts -->
